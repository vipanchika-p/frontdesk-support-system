services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - frontdesk_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  frontdesk_data:
